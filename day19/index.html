<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java Fullstack Training Portal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf1f4;--panel:#ffffff;--side:#12303b;--ink:#12232e;--mute:#587080;--rule:#d0dce3;--acc:#0e7c86;--ok:#2b8a57;--warn:#b8700a;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--panel:#15252e;--side:#0a141a;--ink:#e3edf1;--mute:#8aa3b0;--rule:#27414e;--acc:#3cc0c9;--ok:#5fc58a;--warn:#e6a84a;--bad:#ef7b6d}}
:root[data-theme="dark"]{--bg:#0e1a20;--panel:#15252e;--side:#0a141a;--ink:#e3edf1;--mute:#8aa3b0;--rule:#27414e;--acc:#3cc0c9;--ok:#5fc58a;--warn:#e6a84a;--bad:#ef7b6d}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body.in{overflow:hidden}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#login{height:100%;display:grid;place-items:center;padding:16px}
#login[hidden],#app[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--acc);padding:26px;width:100%;max-width:350px}
.box h1{font-size:24px;margin-bottom:4px}
.box p{color:var(--mute);margin:0 0 14px;font-size:13px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:7px 10px;border:1px solid var(--rule);background:var(--bg);border-radius:3px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:#fff;border:0;padding:8px 16px;border-radius:3px;margin-top:14px;font-weight:600}
.dark .btn{color:#0a141a}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--rule);margin:0;padding:3px 10px;font-size:13px;font-weight:400}
.btn.alt:hover{border-color:var(--acc);color:var(--acc)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.hint{font-size:12px;color:var(--mute);margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
.lt{display:flex;justify-content:space-between;align-items:start}
#app{height:100%;display:flex;flex-direction:column}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 18px;background:var(--side);color:#e3edf1}
header h2{font-size:17px}
header span{color:#9fb6c2;font-size:13px;margin-right:10px}
header .btn.alt{color:#e3edf1;border-color:#3b5967}
.shell{flex:1;min-height:0;display:flex}
nav{flex:none;width:176px;background:var(--panel);border-right:1px solid var(--rule);padding:10px 0;display:flex;flex-direction:column}
nav button{background:none;border:0;border-left:3px solid transparent;text-align:left;padding:10px 16px;color:var(--mute)}
nav button:hover{background:var(--bg)}
nav button.on{color:var(--ink);border-color:var(--acc);background:var(--bg);font-weight:600}
main{flex:1;min-width:0;overflow:auto;padding:16px 20px}
main h1{font-size:22px}
.sub{color:var(--mute);margin:2px 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top .live{padding:8px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border:1px solid var(--rule);background:var(--panel);margin-bottom:12px}
.stats div{padding:10px 14px;border-right:1px solid var(--rule)}
.stats b{display:block;font:700 24px Georgia,serif;color:var(--acc)}
.stats small{color:var(--mute)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--rule);padding:12px 14px}
.panel h3{font-size:15px;margin-bottom:6px}
.panel ul{list-style:none;margin:0;padding:0}
.panel li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:13px}
.panel li:last-child{border:0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:2px solid var(--acc)}
.tag{font-size:12px;padding:0 7px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mu{color:var(--mute)}
.bar{height:8px;background:var(--rule);margin:6px 0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.row>div{flex:1;min-width:130px}
.row .btn{margin:0}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.tools select{width:auto}
.done td:first-child{text-decoration:line-through;color:var(--mute)}
.cal td{text-align:center;width:20%;padding:7px 4px;border:1px solid var(--rule)}
.cal td small{display:block;color:var(--mute);font-size:11px}
.cal .P{color:var(--ok)}.cal .A{color:var(--bad);font-weight:700}.cal .L{color:var(--warn)}
.cal .today{outline:2px solid var(--acc);outline-offset:-2px}
details{border:1px solid var(--rule);background:var(--panel);margin-bottom:5px}
summary{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600}
summary span{font-weight:400;color:var(--mute);font-size:13px}
details ul{list-style:none;margin:0;padding:0 14px 8px}
details li{padding:2px 0;font-size:13px}
li.d:before{content:"\2713  ";color:var(--ok)}li.n:before{content:"\25B6  ";color:var(--acc)}li.u:before{content:"\25CB  ";color:var(--mute)}
li.u{color:var(--mute)}
.live{border-left:4px solid var(--acc);background:var(--panel);border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
@media (max-width:700px){.shell{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:0}
nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:9px 12px}nav button.on{border-bottom-color:var(--acc)}main{padding:12px}}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <div class="lt"><h1>Training Portal</h1><button class="btn alt tg" type="button"></button></div>
    <p>Java Fullstack batch &middot; HCL</p>
    <form id="lf">
      <label for="u">Roll number</label><input id="u" autocomplete="username">
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
      <div class="err" id="le"></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="hint">Demo login: <b>HCL26014</b> / <b>learn123</b></div>
  </div>
</section>

<div id="app" hidden>
  <header><h2>Java Fullstack Training</h2><div><span id="who"></span><button class="btn alt tg"></button> <button class="btn alt" id="out">Log out</button></div></header>
  <div class="shell"><nav id="nav"></nav>
  <main id="main"></main></div>
</div>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=new Date();today.setHours(0,0,0,0);
const off=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return d};
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ---------- dummy data ---------- */
const student={name:'Aarav Sharma',roll:'HCL26014'};
// [title, module, due offset, submitted offset|null, marks|null, max]
const asg=[
 ['Java basics problem set','Core Java',-34,-35,18,20],
 ['Library management (OOP)','Core Java',-27,-27,42,50],
 ['Custom exception handling','Core Java',-20,-18,14,20],
 ['Collections: word frequency & sorting','Core Java',-13,-13,23,25],
 ['Assessment 1: Core Java checkpoint','Core Java',-9,-9,36,40],
 ['Stream pipelines on employee data','Modern Java',-5,-5,17,20],
 ['Optional & java.time exercise','Modern Java',-2,null,null,20],
 ['Git: branching and merge conflicts','Git',3,null,null,10],
 ['Maven multi-module sample','Maven',8,null,null,20]
];
const syl=[
 ['Core Java Fundamentals','+Java Platform Basics|+Language Fundamentals|+Control Flow|+OOP Concepts|+Inheritance & Polymorphism|+Exception Handling|+Collections Framework|+Generics|+Memory Management|+AI Integration|+Assessment 1: Core Java Checkpoint'],
 ['Modern Java (8–21)','+Functional Programming|+Streams API|+Optional & Date/Time|+Concurrency Essentials|+Java 9–21 Key Features|+Immutable Collections & Modern APIs|+AI Integration'],
 ['Version Control – Git','+Git Fundamentals|*Branching & Merging'],
 ['Build Tools, IDE & Debugging','Maven|IDE & Debugging|AI Integration'],
 ['SQL & Database','Relational Database Concepts|CRUD Operations|Joins & Aggregations|Views, Indexing & Constraints|Transactions|AI Integration|Assessment 2: SQL Checkpoint'],
 ['Spring Boot & REST API','Spring Core Concepts|Spring Boot Fundamentals|REST Design Principles|RESTful API Development|Validation & Error Handling|API Documentation|Spring Data JPA|AI Integration'],
 ['Spring Security','Authentication & Authorization|JWT Authentication|AI Integration'],
 ['Backend Testing & Code Quality','JUnit 5|Mockito|Integration Testing|Best Coding Practices|Coding Standards|Code Coverage|SonarQube|AI Integration|Assessment 3: Backend Checkpoint'],
 ['Logging & Monitoring','Structured Logging|Monitoring Awareness'],
 ['Design Patterns & SOLID','SOLID Principles|Key Design Patterns'],
 ['HTML5 & CSS3 Fundamentals','HTML5|CSS3|Bootstrap 5'],
 ['JavaScript Fundamentals','Language Basics|Functions & Scope|DOM Manipulation & Events|ES6+ Features|Asynchronous JavaScript|JSON & Data Handling|Package Management|AI Integration'],
 ['TypeScript','TypeScript Fundamentals|TypeScript with React|Advanced Patterns'],
 ['React.js','React Fundamentals|State & Events|Component Lifecycle & Hooks|Routing|State Management|API Integration|Form Handling|Advanced Topics|AI Integration'],
 ['Frontend Testing','Jest Basics|React Testing Library|E2E Awareness|Assessment 4: Frontend Checkpoint'],
 ['Full-Stack Integration','Connecting React to Spring Boot|End-to-End Data Flow|Error Handling Across Stack|Authentication Flow|AI Integration'],
 ['Microservices Concepts','Architecture Patterns|Key Patterns|Inter-Service Communication'],
 ['Docker & CI/CD','Docker Fundamentals|CI/CD Concepts|Kubernetes Awareness'],
 ['Cloud Awareness','Cloud Fundamentals'],
 ['Security Practices','OWASP Top 10|Secure Coding Habits'],
 ['AI-Augmented Development','GenAI Fundamentals & Ethics|Prompt Engineering|GitHub Copilot — Advanced'],
 ['Agile & Project Readiness','Agile/Scrum Basics|Project Communication|Code Review Culture|Assessment 5: Final Assessment'],
 ['Full-Stack Capstone Project','Project build|Presentation & Review']
].map(m=>({name:m[0],t:m[1].split('|').map(x=>({n:x.replace(/^[+*]/,''),s:x[0]=='+'?'d':x[0]=='*'?'n':'u'}))}));

const defLabs=[
 ['JDK setup & first program','Java Platform Basics',-40,'done','Install JDK, set JAVA_HOME, compile and run from the terminal.'],
 ['Bank account classes','OOP Concepts',-31,'done','Model Account / SavingsAccount with inheritance and an interface.'],
 ['Collections drill','Collections Framework',-14,'done','HashMap vs TreeMap, sort with Comparator, remove duplicates.'],
 ['Stream pipelines','Streams API',-7,'done','Filter, map, group and collect on a list of employees.'],
 ['Git init, commit, push','Git Fundamentals',-1,'done','Create a repo, add .gitignore, push to remote over SSH.'],
 ['Branches & merge conflicts','Branching & Merging',0,'doing','Create feature branches, merge, rebase and resolve a conflict.'],
 ['Maven project setup','Maven',4,'todo','Create a project from the quickstart archetype, add dependencies, run lifecycle phases.']
].map(l=>({t:l[0],topic:l[1],d:l[2],s:l[3],desc:l[4]}));
const defTasks=[
 {id:1,t:'Revise streams notes',p:'Medium',due:ymd(off(1)),done:false},
 {id:2,t:'Push lab code to GitHub',p:'High',due:ymd(off(0)),done:false},
 {id:3,t:'Finish Optional exercise',p:'High',due:ymd(off(-1)),done:false},
 {id:4,t:'Install Maven on laptop',p:'Low',due:ymd(off(3)),done:true}
];
let tasks=ld('tasks',defTasks), labs=ld('labs',defLabs), editId=null;

/* ---------- helpers ---------- */
const isWeekday=d=>d.getDay()>0&&d.getDay()<6;
function attMap(){ // deterministic dummy history for the last ~3 weeks
  const m={};let i=0;
  for(let n=-21;n<0;n++){const d=off(n);if(!isWeekday(d))continue;i++;
    m[ymd(d)]=i%11==5?'A':i%17==9?'L':'P';}
  const t=ld('att_'+ymd(today),null);if(t&&isWeekday(today))m[ymd(today)]=t;
  return m;
}
function attStats(){const m=attMap(),v=Object.values(m);const p=v.filter(x=>x=='P').length;
  return {p,a:v.filter(x=>x=='A').length,l:v.filter(x=>x=='L').length,pct:v.length?Math.round(p/v.length*100):0}}
function sylStats(){let d=0,t=0;syl.forEach(m=>m.t.forEach(x=>{t++;if(x.s=='d')d++}));return {d,t,pct:Math.round(d/t*100)}}
function classInfo(){
  const now=new Date(),mins=now.getHours()*60+now.getMinutes();
  if(isWeekday(now)&&mins>=870&&mins<1050)return {live:true,txt:'Class is on right now, ends at 5:30 PM.'};
  let n=new Date(now);if(!(isWeekday(now)&&mins<870))n.setDate(n.getDate()+1);
  while(!isWeekday(n))n.setDate(n.getDate()+1);
  return {live:false,txt:'Next class: '+days[n.getDay()]+', '+fmt(n)+' at 2:30 PM.'};
}
const asgState=a=>{
  if(a[3]!==null){const late=a[3]>a[2];
    return a[4]!==null?`<b>${a[4]}/${a[5]}</b>${late?' <span class="tag warn">late</span>':''}`:'<span class="tag mu">under review</span>'}
  return a[2]<0?'<span class="tag bad">overdue</span>':'<span class="tag warn">pending</span>';
};

/* ---------- views ---------- */
const V={};
V.home=()=>{
  const a=attStats(),s=sylStats(),open=asg.filter(x=>x[3]===null).length;
  const dn=asg.filter(x=>x[4]!==null),avg=Math.round(dn.reduce((t,x)=>t+x[4]/x[5],0)/dn.length*100);
  const ci=classInfo(),cur=syl.flatMap(m=>m.t).find(x=>x.s=='n'),lab=labs.find(l=>l.s=='doing');
  const due=asg.filter(x=>x[3]===null).sort((x,y)=>x[2]-y[2]).slice(0,4);
  const tk=tasks.filter(t=>!t.done).slice(0,4);
  const nxt=syl.flatMap(m=>m.t).filter(x=>x.s=='u').slice(0,3);
  return `<div class="top"><div><h1>Hello, ${esc(student.name.split(' ')[0])}</h1><p class="sub" style="margin:0">${days[today.getDay()]}, ${fmt(today)} &middot; Mon–Fri 2:30 to 5:30 PM</p></div><div class="live">${ci.txt}</div></div>
  <div class="stats"><div><b>${a.pct}%</b><small>Attendance</small></div><div><b>${avg}%</b><small>Avg. score</small></div>
  <div><b>${open}</b><small>Assignments open</small></div><div><b>${s.pct}%</b><small>Syllabus done</small></div>
  <div><b>${tasks.filter(t=>!t.done).length}</b><small>Open tasks</small></div></div>
  <div class="dash">
  <div class="panel"><h3>Next deadlines</h3><ul>${due.map(x=>`<li><span>${esc(x[0])}</span><span class="mu">${fmt(off(x[2]))}</span></li>`).join('')}</ul></div>
  <div class="panel"><h3>My tasks</h3><ul>${tk.length?tk.map(t=>`<li><span>${esc(t.t)}</span><span class="mu">${t.p}</span></li>`).join(''):'<li class="mu">All caught up.</li>'}</ul></div>
  <div class="panel"><h3>Where we are</h3><div class="bar"><i style="width:${s.pct}%"></i></div>
   <ul><li><span>Now</span><b>${cur?esc(cur.n):'–'}</b></li><li><span>Lab</span><b>${lab?esc(lab.t):'–'}</b></li>
   <li><span>Up next</span><span>${nxt.map(x=>esc(x.n)).join(', ')}</span></li></ul></div></div>`;
};
V.asg=()=>{
  const f=V.asgF||'all';
  const rows=asg.filter(x=>f=='all'||(f=='open'?x[3]===null:x[3]!==null));
  return `<h1>Assignments</h1><p class="sub">Due dates, when you submitted, and marks.</p>
  <div class="tools"><label style="margin:0">Show</label><select id="af"><option value="all">All</option><option value="open">Not submitted</option><option value="sub">Submitted</option></select></div>
  <div class="wrap"><table><tr><th>#</th><th>Assignment</th><th>Module</th><th>Due</th><th>Submitted</th><th>Result</th></tr>
  ${rows.map((x,i)=>`<tr><td>${asg.indexOf(x)+1}</td><td>${esc(x[0])}</td><td>${x[1]}</td><td>${fmt(off(x[2]))}</td><td>${x[3]!==null?fmt(off(x[3])):'–'}</td><td>${asgState(x)}</td></tr>`).join('')}</table></div>`;
};
V.tasks=()=>{
  const e=tasks.find(t=>t.id===editId)||{t:'',p:'Medium',due:''};
  return `<h1>Task manager</h1><p class="sub">Your own to-do list. Add, edit, tick off, delete.</p>
  <div class="row"><div style="flex:3"><label for="tt">Task</label><input id="tt" value="${esc(e.t)}" maxlength="80"></div>
  <div><label for="tp">Priority</label><select id="tp">${['High','Medium','Low'].map(p=>`<option${p==e.p?' selected':''}>${p}</option>`).join('')}</select></div>
  <div><label for="td">Due</label><input id="td" type="date" value="${e.due}"></div>
  <button class="btn" id="ts">${editId?'Save changes':'Add task'}</button>${editId?'<button class="btn alt" id="tc">Cancel</button>':''}</div>
  <div class="err" id="te"></div>
  <div class="wrap"><table><tr><th>Task</th><th>Priority</th><th>Due</th><th></th></tr>
  ${tasks.length?tasks.map(t=>`<tr class="${t.done?'done':''}"><td>${esc(t.t)}</td><td>${t.p}</td><td>${t.due?fmt(new Date(t.due+'T00:00')):'–'}</td>
  <td style="white-space:nowrap"><button class="btn alt" data-a="tog" data-i="${t.id}">${t.done?'Reopen':'Done'}</button> <button class="btn alt" data-a="edit" data-i="${t.id}">Edit</button> <button class="btn alt" data-a="del" data-i="${t.id}">Delete</button></td></tr>`).join(''):'<tr><td colspan="4" class="mu">Nothing here. Add your first task above.</td></tr>'}</table></div>`;
};
V.att=()=>{
  const m=attMap(),s=attStats(),ci=classInfo();
  const mon=off(-21);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  let g='';for(let w=0;w<4;w++){g+='<tr>';for(let d=0;d<5;d++){const c=new Date(mon);c.setDate(mon.getDate()+w*7+d);const k=ymd(c);
    g+=`<td class="${k==ymd(today)?'today':''} ${m[k]||''}"><small>${fmt(c)}</small>${m[k]||(c>today?'':'…')}</td>`}g+='</tr>'}
  const canMark=isWeekday(today)&&!m[ymd(today)]&&ci.live;
  return `<h1>Attendance</h1><p class="sub">Last three weeks. P present, A absent, L leave.</p>
  <div class="stats"><div><b>${s.pct}%</b><small>Overall</small></div><div><b>${s.p}</b><small>Present</small></div><div><b>${s.a}</b><small>Absent</small></div><div><b>${s.l}</b><small>Leave</small></div></div>
  ${s.pct<75?'<p class="bad">Below the 75% requirement. Talk to your trainer.</p>':''}
  ${canMark?'<p><button class="btn" id="mk" style="margin:0 0 14px">Mark me present for today</button></p>':''}
  <table class="cal"><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr>${g}</table>`;
};
V.syl=()=>{
  const s=sylStats(),f=V.sylF||'all';
  return `<h1>Syllabus</h1><p class="sub">${s.d} of ${s.t} topics covered</p><div class="bar"><i style="width:${s.pct}%"></i></div>
  <div class="tools"><label style="margin:0">Show</label><select id="sf"><option value="all">All topics</option><option value="d">Covered</option><option value="n">In progress</option><option value="u">To be covered</option></select></div>
  ${syl.map((m,i)=>{const t=m.t.filter(x=>f=='all'||x.s==f);if(!t.length)return'';const d=m.t.filter(x=>x.s=='d').length;
   return `<details${m.t.some(x=>x.s=='n')||f!='all'?' open':''}><summary>${i+1}. ${esc(m.name)}<span>${d}/${m.t.length}</span></summary><ul>${t.map(x=>`<li class="${x.s}">${esc(x.n)}</li>`).join('')}</ul></details>`}).join('')}`;
};
V.lab=()=>`<h1>Lab</h1><p class="sub">Hands-on sessions. Tick them off once your code is pushed.</p>
  <div class="wrap"><table><tr><th>Lab</th><th>Topic</th><th>Date</th><th>Status</th><th></th></tr>
  ${labs.map((l,i)=>`<tr><td><b>${esc(l.t)}</b><br><span class="mu">${esc(l.desc)}</span></td><td>${esc(l.topic)}</td><td>${fmt(off(l.d))}</td>
  <td>${l.s=='done'?'<span class="tag ok">done</span>':l.s=='doing'?'<span class="tag warn">in progress</span>':'<span class="tag mu">upcoming</span>'}</td>
  <td>${l.s!='todo'?`<button class="btn alt" data-a="lab" data-i="${i}">${l.s=='done'?'Undo':'Mark done'}</button>`:''}</td></tr>`).join('')}</table></div>`;

/* ---------- wiring ---------- */
const tabs=[['home','Overview'],['asg','Assignments'],['tasks','Tasks'],['att','Attendance'],['syl','Syllabus'],['lab','Lab']];
let cur='home';
function show(v){cur=v;
  $('#nav').innerHTML=tabs.map(t=>`<button data-v="${t[0]}" class="${t[0]==v?'on':''}">${t[1]}</button>`).join('');
  $('#main').innerHTML=V[v]();
  const af=$('#af');if(af){af.value=V.asgF||'all';af.onchange=()=>{V.asgF=af.value;show('asg')}}
  const sf=$('#sf');if(sf){sf.value=V.sylF||'all';sf.onchange=()=>{V.sylF=sf.value;show('syl')}}
  const mk=$('#mk');if(mk)mk.onclick=()=>{sv('att_'+ymd(today),'P');show('att')};
  const ts=$('#ts');if(ts)ts.onclick=saveTask;
  const tc=$('#tc');if(tc)tc.onclick=()=>{editId=null;show('tasks')};
}
function saveTask(){
  const t=$('#tt').value.trim(),p=$('#tp').value,d=$('#td').value;
  if(t.length<3){$('#te').textContent='Task needs at least 3 characters.';return}
  if(editId){const x=tasks.find(k=>k.id===editId);Object.assign(x,{t,p,due:d});editId=null}
  else tasks.unshift({id:Date.now(),t,p,due:d,done:false});
  sv('tasks',tasks);show('tasks');
}
$('#nav').onclick=e=>{const v=e.target.dataset.v;if(v){editId=null;show(v)}};
$('#main').onclick=e=>{
  const a=e.target.dataset.a,i=+e.target.dataset.i;if(!a)return;
  if(a=='tog'){const t=tasks.find(k=>k.id===i);t.done=!t.done;sv('tasks',tasks)}
  if(a=='del'){if(!confirm('Delete this task?'))return;tasks=tasks.filter(k=>k.id!==i);sv('tasks',tasks)}
  if(a=='edit'){editId=i}
  if(a=='lab'){labs[i].s=labs[i].s=='done'?'doing':'done';sv('labs',labs)}
  show(cur);
};
$('#lf').onsubmit=e=>{e.preventDefault();
  const u=$('#u').value.trim().toUpperCase(),p=$('#p').value;
  if(!u||!p){$('#le').textContent='Enter both roll number and password.';return}
  if(u!==student.roll||p!=='learn123'){$('#le').textContent='Roll number or password is wrong.';return}
  $('#login').hidden=true;$('#app').hidden=false;document.body.classList.add('in');
  $('#who').textContent=student.name+' ('+student.roll+')';show('home');
};
$('#out').onclick=()=>{document.body.classList.remove('in');$('#app').hidden=true;$('#login').hidden=false;$('#p').value='';$('#le').textContent=''};

const root=document.documentElement;
const curTheme=()=>root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function paint(){const d=curTheme()=='dark';document.body.classList.toggle('dark',d);document.querySelectorAll('.tg').forEach(b=>b.textContent=d?'Light mode':'Dark mode')}
document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{const t=curTheme()=='dark'?'light':'dark';root.dataset.theme=t;sv('theme',t);paint()});
const saved=ld('theme',null);if(saved)root.dataset.theme=saved;paint();
</script>
</body>
